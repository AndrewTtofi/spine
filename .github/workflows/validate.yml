name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release-check diffs against the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate skill wiring + manifests
        run: node scripts/validate.mjs
      - name: Run validator tests
        run: npm test
      - name: Require a version bump when the plugin surface changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          node scripts/release-check.mjs
